name: タスク
description: 実装・設計・実験・テストプレイ・プロセス改善・マーケティングのタスク
# P2(先送り可)を既定で付ける。優先順位を上げるのは明示的な判断であり、
# 既定が空だと「付け忘れ」と「P2 と判断した」が区別できない。
labels: ["P2"]
body:
  - type: markdown
    attributes:
      value: |
        **本文は箇条書き15行以内。設計はドキュメントへリンクし、ここに書かない。**
        閉じる条件を1行で書けないものは、まだタスクではありません(親 issue にするか分割する)。

        **作成後に `type:*` ラベルを1つ付けてください。** 型は**ラベルだけが正**で、本文には書きません。
        優先順位は `P2` が既定で付きます。上げるときは `P0` / `P1` に付け替えてください。
        運用の正は [docs/process/04-issue-driven.md](../blob/master/docs/process/04-issue-driven.md)。
  - type: input
    id: done
    attributes:
      label: 閉じる条件
      description: 1行で書く。書けないならタスクとして未熟。
      placeholder: 例) 生産・消費システムのテストが緑で、PR がマージされている
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: やること / やらないこと
      description: スコープの境界。**「やらないこと」を書くのが要点**。
    validations:
      required: true
  - type: textarea
    id: refs
    attributes:
      label: 参照する文書
      description: GDD / TDD / ADR の該当節へのリンク。ここに設計を書かない。
  - type: input
    id: deps
    attributes:
      label: 依存
      description: 待っている issue 番号。あれば `blocked` ラベルも付ける。
