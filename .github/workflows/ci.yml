name: CI

# 目的(TDD01 §1, ADR-0001):
#   1. コンパイル段階で幻覚APIや古いAPIの使用を機械的に弾く(警告=エラー)
#   2. 決定論の破れ(ADR-0002)をテストで常時検出する
#   3. Godot 側はヘッドレス煙試験(godot ジョブ)で、Godot の中で出した状態ハッシュが
#      vsim hash と一致することを見る(TDD01 §2.1・§3.10。gdUnit4 は入れない)。

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  sim:
    name: Visionary.Sim (build & test)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # SDK版は global.json が正。ここに版を書くと二重管理になる
          global-json-file: global.json

      # ドキュメントのみの変更でも走るが、restore キャッシュにより数秒で終わる
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Visionary.sln

      - name: Build
        run: dotnet build Visionary.sln --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test Visionary.sln
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: artifacts/test-results/
          retention-days: 14

      - name: Determinism (cross-process state hash)
        run: |
          ARGS="hash --seed 20260904 --ticks 720"
          RUN="dotnet run --project src/Visionary.Sim.Runner -c Release --no-build --"
          A=$($RUN $ARGS)
          B=$($RUN $ARGS)
          C=$($RUN hash --seed 20260905 --ticks 720)
          echo "same-seed run1=$A run2=$B / other-seed=$C"
          if [ "$A" != "$B" ]; then
            echo "::error::同一シードの状態ハッシュが別プロセス間で一致しない (TDD01 §3.8)"; exit 1
          fi
          if [ "$A" = "$C" ]; then
            echo "::error::シードを変えても状態ハッシュが変わらない。ハッシュが状態を見ていない (TDD01 §3.8)"; exit 1
          fi

  godot:
    name: Godot (headless smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GODOT_VERSION: 4.7.2   # TDD01 §2 の固定。上げるときは Visionary.Game.csproj の Sdk と同時に

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v6
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-mono-linux

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o ~/godot/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          unzip -q ~/godot/godot.zip -d ~/godot
          rm ~/godot/godot.zip

      - name: Locate Godot
        run: |
          GODOT=$(find ~/godot -type f -name "Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64" | head -n 1)
          if [ -z "$GODOT" ]; then
            echo "::error::展開した Godot の実行ファイルが見つからない"; exit 1
          fi
          chmod +x "$GODOT"
          echo "GODOT_BIN=$GODOT" >> "$GITHUB_ENV"

      - name: Build Visionary.Game
        run: dotnet build src/Visionary.Game/Visionary.Game.csproj -c Debug

      - name: Import
        run: $GODOT_BIN --headless --path src/Visionary.Game --import

      - name: Smoke (state hash inside Godot vs vsim hash)
        run: |
          set +e
          OUT=$($GODOT_BIN --headless --path src/Visionary.Game -- --seed=20260904 --smoke-ticks=720)
          CODE=$?
          set -e
          echo "$OUT"
          if [ "$CODE" -ne 0 ]; then
            echo "::error::煙試験の終了コードが 0 でない ($CODE)"; exit 1
          fi
          SMOKE=$(echo "$OUT" | grep '^VISIONARY_SMOKE_HASH=' | head -n 1 | cut -d= -f2 | tr -d '\r')
          if [ -z "$SMOKE" ]; then
            echo "::error::煙試験の出力に VISIONARY_SMOKE_HASH= の行が無い"; exit 1
          fi
          REF=$(dotnet run --project src/Visionary.Sim.Runner -c Release -- hash --seed 20260904 --ticks 720)
          echo "smoke=$SMOKE reference=$REF"
          if [ "$SMOKE" != "$REF" ]; then
            echo "::error::Godot の中の状態ハッシュが vsim hash と一致しない (TDD01 §3.10)"; exit 1
          fi

  format:
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # SDK版は global.json が正。ここに版を書くと二重管理になる
          global-json-file: global.json

      # 差分が出た場合は `dotnet format` をローカルで実行してコミットする
      - name: Verify formatting
        run: dotnet format Visionary.sln --verify-no-changes --severity warn

  docs:
    name: Docs consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      # 枠ガードの閾値(#132 決定1)は `pipeline.ps1` の定数が正で、04「枠」規則2 /
      # CLAUDE.md / 05 が同じ数値を書き写している。二重管理は消せないので機械に見させる(#139)。
      # 落ちたら `scripts/check-budget-threshold.sh` の出力が正と写しの両方を出す。
      - name: Budget-gate threshold (docs vs pipeline.ps1)
        run: bash scripts/check-budget-threshold.sh

  guard:
    name: Pipeline guard
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      # ガードは PreToolUse フックなので普通のテストから呼べない。使い捨ての git リポジトリに
      # 生きたロックを置き、フックへイベントを流して終了コードを見る(#152 決定2)。
      # **Ubuntu が守るのはホスト非依存の範囲だけである** — 綴り替え(C:\ / C:/ / /c/ /
      # /cygdrive/)は Windows でだけ効く設計なので skip される。**skip は黙って通らない** —
      # 件数と理由をハーネスが出力する。全件を走らせるには Windows の開発機で打つ。
      - name: Guard behaviour (fixture repo + live lock)
        shell: pwsh
        run: ./scripts/check-pipeline-guard.ps1
